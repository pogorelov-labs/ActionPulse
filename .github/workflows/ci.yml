name: CI

on:
  push:
    branches: [main]
    paths:
      - 'digest-core/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'digest-core/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: digest-core

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'digest-core/pyproject.toml'

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Black format check
        run: uv run black --check src/ tests/

  terminal-matrix:
    # Degradation-matrix guard (TERMINAL_DESIGN.md §7, roadmap T7): the
    # progress/ui/conformance tests must hold under a hostile terminal env.
    runs-on: ubuntu-latest
    env:
      TERM: dumb
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'digest-core/pyproject.toml'

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Progress + ui tests under TERM=dumb / NO_COLOR
        run: >
          uv run pytest tests/test_progress_sink.py tests/test_progress_plain.py
          tests/test_progress_live.py tests/test_ui_tokens.py
          tests/test_terminal_conformance.py tests/test_ui_select.py
          tests/test_menu_pty.py tests/test_reader.py -q

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'digest-core/pyproject.toml'

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest tests/ -v
        env:
          PYTHONPATH: src

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t digest-core:ci -f docker/Dockerfile .
        working-directory: digest-core

  # Deterministic eval gate (decision D2): replay the synthetic corpus and FAIL on
  # metric regression (cli exit 2). No LLM/network. recall_floor-based gating stays
  # off until reactions-based calibration produces a defensible floor.
  eval-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'digest-core/pyproject.toml'

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Replay corpus vs committed baseline
        run: uv run python -m digest_core.cli eval-replay
        env:
          PYTHONPATH: src

  # Report-only dependency audit (EP-6, F12). Deliberately non-blocking until the
  # owner sets a gating policy — findings must be a recorded decision, not a
  # surprise inside the air-gap.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Export hashed lockfile
        run: uv export --frozen --no-emit-project --format requirements-txt -o requirements.ci.lock

      - name: pip-audit (report-only)
        run: uvx pip-audit -r requirements.ci.lock --disable-pip
        continue-on-error: true
