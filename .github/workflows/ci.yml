name: CI

on:
  push:
    branches: [main]
    paths:
      - 'digest-core/**'
      - 'install.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'digest-core/**'
      - 'install.sh'
      - '.github/workflows/ci.yml'
  # Nightly full-suite run. push/pull_request only fire on a commit, so a test that
  # flips red with the wall-clock rather than a code change — a fixture aging past
  # the store's 30-day TTL / 7-day retention window (see PR #210, and #207 before
  # it) — can sit red on main for weeks until an unrelated push happens to re-run
  # CI. This scheduled run resurfaces such date-rot within a day. GitHub only fires
  # schedule from the default branch; 05:17 UTC dodges the top-of-hour backlog.
  schedule:
    - cron: '17 5 * * *'
  # On-demand full-suite run (e.g. to confirm main is green after a date-rot fix)
  # without needing a commit that touches the path filters above.
  workflow_dispatch:

defaults:
  run:
    working-directory: digest-core

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'digest-core/pyproject.toml'

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Black format check
        run: uv run black --check src/ tests/

  shellcheck:
    # The bootstrap install.sh + shell scripts are otherwise untested. shellcheck (preinstalled
    # on ubuntu runners) catches real quoting/word-split bugs at warning severity. Runs from the
    # repo root (the workflow default is digest-core) so install.sh resolves.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck shell scripts
        run: >-
          shellcheck --severity=warning --shell=bash
          install.sh
          digest-core/deploy/install-systemd.sh
          digest-core/scripts/*.sh

  terminal-matrix:
    # Degradation-matrix guard (TERMINAL_DESIGN.md §7, roadmap T7): the
    # progress/ui/conformance tests must hold under a hostile terminal env.
    runs-on: ubuntu-latest
    env:
      TERM: dumb
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'digest-core/pyproject.toml'

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Progress + ui tests under TERM=dumb / NO_COLOR
        run: >
          uv run pytest tests/test_progress_sink.py tests/test_progress_plain.py
          tests/test_progress_live.py tests/test_ui_tokens.py
          tests/test_terminal_conformance.py tests/test_ui_select.py
          tests/test_menu_pty.py tests/test_reader.py -q

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'digest-core/pyproject.toml'

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest tests/ -v
        env:
          PYTHONPATH: src

  test-store:
    # The opt-in encrypted store (digest_core.store) needs the `store` extra; the
    # default `test` job above skips every store test (skipif not HAS_SQLCIPHER).
    # This lane installs the extra (Linux sqlcipher3-binary wheel + numpy) so the
    # store/watermark/search tests actually execute.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'digest-core/pyproject.toml'

      - name: Install dependencies (+ store extra)
        run: uv sync --all-groups --extra store

      - name: Run tests (store extra enabled)
        run: uv run --extra store pytest tests/ -q
        env:
          PYTHONPATH: src

  test-mcp:
    # The opt-in MCP server (digest_core.mcp) needs the `mcp` extra (FastMCP SDK) to
    # build its app; the _build_app registration tests skip without it. This lane
    # installs mcp + store so the MCP server is actually exercised in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'digest-core/pyproject.toml'

      - name: Install dependencies (+ mcp + store extras)
        run: uv sync --all-groups --extra mcp --extra store

      - name: Run MCP server tests (tool bodies + in-memory protocol round-trip)
        run: uv run --extra mcp --extra store pytest tests/test_mcp_server.py tests/test_mcp_e2e.py -q
        env:
          PYTHONPATH: src

  coverage:
    # Coverage gate on the recently-shipped, highest-risk subsystems (store / api / mcp,
    # scoped in pyproject [tool.coverage.run]). The floor (80) sits below the current ~86%
    # so refactors keep headroom while a real regression fails the build. Installs both
    # extras like the store/mcp lanes so those paths actually execute.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'digest-core/pyproject.toml'

      - name: Install dependencies (+ store + mcp extras)
        run: uv sync --all-groups --extra store --extra mcp

      - name: Coverage gate (store/api/mcp, fail-under 80)
        run: >-
          uv run --extra store --extra mcp pytest tests/ -q
          --ignore=tests/test_menu_pty.py --ignore=tests/test_reader.py
          --cov --cov-report=term-missing --cov-fail-under=80
        env:
          PYTHONPATH: src

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t digest-core:ci -f docker/Dockerfile .
        working-directory: digest-core

  # Deterministic eval gate (decision D2): replay the synthetic corpus and FAIL on
  # metric regression (cli exit 2). No LLM/network. recall_floor-based gating stays
  # off until reactions-based calibration produces a defensible floor.
  eval-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'digest-core/pyproject.toml'

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Replay corpus vs committed baseline
        run: uv run python -m digest_core.cli eval-replay
        env:
          PYTHONPATH: src

  # Report-only dependency audit (EP-6, F12). Deliberately non-blocking until the
  # owner sets a gating policy — findings must be a recorded decision, not a
  # surprise inside the air-gap.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Export hashed lockfile
        run: uv export --frozen --no-emit-project --format requirements-txt -o requirements.ci.lock

      - name: pip-audit (report-only)
        run: uvx pip-audit -r requirements.ci.lock --disable-pip
        continue-on-error: true

  # A scheduled run has no PR author watching it, and CI does not gate the deploy
  # here, so a red nightly is effectively invisible: the 2026-07-16..07-24 outage
  # ran NINE consecutive nights unnoticed, on a repo that had been dormant 25 days.
  # GitHub's default behaviour (email the cron's last editor) demonstrably was not
  # enough — nine such emails would have been sent. So put the signal on the board
  # instead of in an inbox: open a tracking issue on the first red nightly, and
  # comment on it for each one after, so a run of failures is one thread, not spam.
  # Scheduled runs only — a push/PR failure already has someone watching it.
  notify-failure:
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs:
      - lint
      - shellcheck
      - terminal-matrix
      - test
      - test-store
      - test-mcp
      - coverage
      - docker
      - eval-replay
      - audit
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-failure tracking issue
        # No checkout: `gh` addresses the repo over the API. The workflow-level
        # `working-directory: digest-core` would fail without one, hence the override.
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # This repo's default GITHUB_TOKEN permission is `read`; the job-level
          # `permissions: issues: write` above is what grants the write scope. If an
          # org policy ever caps that, the API call 403s — and because this job only
          # runs on an already-red nightly, a silent failure here would recreate
          # exactly the blind spot it exists to remove. So say so, loudly.
          fail() {
            echo "::error::notify-failure could not file the tracking issue. If this is a 403, the GITHUB_TOKEN lacks 'issues: write' — check Settings > Actions > General > Workflow permissions (repo default is currently 'read'), or the org-level Actions policy. The nightly failure this was reporting is still real: $RUN_URL"
            exit 1
          }

          # Idempotent; a pre-existing label (or a races-with-itself rerun) is fine.
          gh label create ci-nightly --repo "$REPO" --color B60205 \
            --description "Automated: scheduled CI failure tracking" >/dev/null 2>&1 || true

          existing="$(gh issue list --repo "$REPO" --state open --label ci-nightly \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body \
              "Still red — [run]($RUN_URL) at commit \`${GITHUB_SHA:0:12}\`." || fail
          else
            gh issue create --repo "$REPO" --label ci-nightly \
              --title "CI: the nightly run is failing on main" \
              --body "The scheduled CI run failed on \`main\`.

          - **Run:** $RUN_URL
          - **Commit:** \`$GITHUB_SHA\`

          Filed automatically by the \`notify-failure\` job. Subsequent failures are added
          as comments here rather than as new issues. **Close this once \`main\` is green** —
          a fresh issue opens if the nightly fails again.

          A red nightly usually means a test flipped without a code change. Two classes seen
          so far: **date-rot** (a fixture aging past the store's 30-day TTL or the 7-day
          retention window — #210, #207) and **environment-dependence** (a filesystem-ordering
          flake that tracked the CI runner image, not the calendar — #212). Check whether any
          commit landed in the failure window before assuming the code broke." || fail
          fi
