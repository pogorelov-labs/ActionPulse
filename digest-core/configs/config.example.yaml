# Report rendering (L1): output language for the digest, prompts and labels.
# "en" (default) or "ru". Env override: DIGEST_REPORT_LANGUAGE.
report:
  language: "en"

time:
  user_timezone: "Europe/Moscow"
  window: "calendar_day"
  mailbox_tz: "Europe/Moscow"      # Mailbox timezone for normalizing naive datetime
  runner_tz: "Europe/Moscow"   # Runner/job timezone
  fail_on_naive: true              # Fail if naive datetime is encountered

ews:
  endpoint: "https://owa.corp-domain.ru/EWS/Exchange.asmx"  # <-- CHANGE
  user_upn: "login@corp-domain.ru"      # <-- CHANGE: your corp email
  user_login: "ruapgr2"                 # <-- CHANGE: your MACHINE login (whoami), NOT the email local part
  user_domain: "corp-domain.ru"         # <-- CHANGE: your domain
  password_env: "EWS_PASSWORD"
  verify_ca: "/etc/ssl/corp-ca.pem"     # <-- CHANGE or remove if not needed
  autodiscover: false
  folders: ["Inbox"]
  lookback_hours: 24
  page_size: 100
  # sync_state_path: unset by default — the watermark lives in the data home
  # (<data home>/var/state/ews.syncstate; see `actionpulse paths`). Set only to
  # pin a custom location; cwd-relative values bring back the pre-U5 reset bug.
  user_aliases: ["Name", "Surname", "Name.Surname@corp-domain.ru", "login"]  # <-- CHANGE

llm:
  # The gateway's OpenAI front (per the CIB endpoint reference); a legacy
  # "/api/v1/chat" path may appear in older configs — unverified, do not copy it.
  endpoint: "https://llm-gw.corp.com/v1/chat/completions"     # <-- CHANGE
  model: "qwen35-397b-a17b"
  timeout_s: 120
  temperature: 0.0           # 0.0 = deterministic extraction (default)
  max_output_tokens: 6000    # Per-call completion cap; a real prod day measured 5,226.
                             # Clamped to the gateway ceiling 16384 (oversize → HTTP 429).
  headers:
    Authorization: "Bearer ${LLM_TOKEN}"
  max_tokens_per_run: 30000
  cost_limit_per_run: 5.0
  rate_limit_rpm: 15         # Default per-model RPM (fallback for models not in fleet_rpm)
  # Per-model request-per-minute buckets for the gateway fleet (RateBroker, PR2).
  fleet_rpm:
    qwen35-397b-a17b: 15
    qwen3-next-80b-a3b: 45
    glm-4.7-flash: 60
    qwen35-35b-a3b: 30
    bge-m3: 30
    qwen3-embedding: 30
    bge-reranker-v2-m3: 10
  fleet_burst: 3             # Token-bucket burst per model
  stage_call_budgets:        # Hard per-stage call budgets per run (extractor=2 == ADR-008)
    extractor: 2
    reranker: 10
    embeddings: 30
    judge: 8
    tokenize: 20
  strict_json: true          # Enforce strict JSON validation with Pydantic
  max_retries: 3             # Maximum retry attempts for invalid JSON

deliver:
  mattermost:
    enabled: true
    webhook_url_env: "MM_WEBHOOK_URL"
    max_message_length: 16383
    include_trace_footer: true
    # D4 delivery guard: a webhook URL is an opaque token, so the target
    # audience is NOT derivable. Set true once you have confirmed the webhook
    # points at a PRIVATE DM/channel (the setup wizard asks). While false, every
    # run emits one privacy-unconfirmed warning before delivery — it never blocks.
    acknowledged_private: false
    # --- Transport ---------------------------------------------------------
    # "webhook" (default, externally reachable, write-only) or "api" (authenticated
    # v4 REST as the owner's PAT). "api" posts to a provably-private, owner-only
    # target and captures post_ids for the EP-15 reaction loop; it is corp-network
    # only (the edge proxy 403s external Bearer), so it runs inside corp like
    # EWS/LLM. Webhook stays the default. Reuses the ingest PAT identity:
    # MM_BASE_URL + MM_PAT (secret; ENV only, never YAML).
    auth_mode: webhook
    base_url_env: "MM_BASE_URL"
    token_env: "MM_PAT"
    # api target: "private_channel" finds-or-creates a dedicated owner-only private
    # channel (idempotent by channel_name) and posts there; "self_dm" posts to your
    # [me,me] self-DM. Both make the audience provable (auto-satisfy the D4 guard).
    delivery_target: private_channel
    channel_name: "actionpulse-digest"          # team-unique slug (idempotency key)
    channel_display_name: "ActionPulse Digest"
    team: ""                                     # id/name/display_name; "" = first team
    # If create_private_channel is denied (the corp build may restrict it), fall
    # back to self-DM delivery instead of failing.
    fallback_to_self_dm: true
    verify_ssl: true

# Mattermost INGEST (source adapter) — the READ side, distinct from deliver
# above. Reads posts via the authenticated v4 REST API with a personal access
# token (PAT in MM_PAT, ENV-only). Corp-network-only. OFF by default.
# Env overrides use the MM_SOURCE_ prefix (e.g. MM_SOURCE_DM_SCOPE).
mm_source:
  enabled: false             # master switch for MM ingest (mentions/channels/DMs)
  # base_url: "https://mm.corp"   # or set MM_BASE_URL; token is MM_PAT (ENV-only)
  # @-mentions of the owner are ingested from EVERY channel when enabled.
  # channel_allowlist: ingest these channels IN FULL (general posts as context),
  # matched by id / name / display_name. Empty = mentions-only.
  channel_allowlist: []
  max_posts_per_channel: 200  # cap on general posts per allowlisted channel
  # --- Direct messages (P3, privacy ladder — design §2.2/§6) ---------------
  # DMs carry colleagues' messages (third-party PII). HARD-OFF by default.
  #   off            — no DMs (default)
  #   own_posts_only — only YOUR own DM messages; colleagues' text never read
  #                    (no third-party PII → no consent needed)
  #   selected       — full thread, but only with people in dm_allowlist
  #   all            — every DM + group-DM (discouraged)
  # 'selected'/'all' REQUIRE dm_consent_acknowledged=true (set by the wizard/menu,
  # NOT by hand — a hand-set flag is a footgun, not informed consent). The config
  # REFUSES to load 'selected'/'all' without it. Group-DMs (type 'G') follow this
  # same scope; under 'selected' a group-DM is kept iff ANY member is allowlisted.
  dm_scope: "off"
  dm_allowlist: []           # counterparty @username / email / user_id (NOT channel name)
  dm_max_quote_chars: 280    # verbatim cap on COUNTERPARTY text (your own posts uncapped)
  dm_consent_acknowledged: false
  # dm_consent_acknowledged_at: null   # ISO-8601 UTC, set with the ack

# Retention: time-prune on-disk artifacts at the end of a real run. The digest
# pair carries verbatim subjects/senders/quotes (PDn); trace meta is payload-
# free but run-identifying. Default 7 days; keep_days < 1 is a no-op safety rail.
# Env overrides: DIGEST_RETENTION_ENABLED / DIGEST_RETENTION_KEEP_DAYS.
retention:
  enabled: true
  keep_days: 7

# Embedding-assisted thread merging (REDESIGN PR12a, cosine tier). OFF by
# default: enabling sends thread-representative text to /v1/embeddings —
# live use is gated by PC-2; offline replay via the fleet sidecar is safe.
# threading:
#   embedding_merge: true
#   embedding_model: "bge-m3"
#   similarity_threshold: 0.85
#   max_candidates: 64

observability:
  prometheus_port: 9108
  log_level: "INFO"
  # Structured JSON run logs in <data home>/var/logs (U6; toggle via the menu
  # Maintenance screen or `log_to_file: false`). Everything stays local —
  # there is no phone-home telemetry.
  log_to_file: true
  # OTel GenAI spans (EP-8): run -> stages -> gen_ai.* LLM call. Structural
  # attributes only (no prompt/completion content, ever). Needs the 'otel' extra.
  otel_enabled: false
  # otel_export_path: "out/spans.jsonl"   # JSON-lines file; unset = console

selection_buckets:
  threads_top: 10           # Minimum threads to cover (1 chunk each)
  addressed_to_me: 8        # Minimum chunks with AddressedToMe=true
  dates_deadlines: 6        # Minimum chunks with dates/deadlines
  critical_senders: 4       # Minimum chunks from sender_rank>=2
  per_thread_max: 3         # Maximum chunks per thread
  max_total_chunks: 20      # Maximum total chunks to select

selection_weights:
  recency: 2.0              # Weight for message recency
  addressed_to_me: 3.0      # Weight for AddressedToMe flag
  action_verbs: 1.5         # Weight per action verb found
  question_mark: 1.0        # Weight for questions
  dates_found: 1.5          # Weight per date/deadline found
  importance_high: 2.0      # Weight for High importance
  is_flagged: 1.5           # Weight for flagged messages
  has_doc_attachments: 1.0  # Weight for doc/xlsx/pdf attachments
  sender_rank: 1.0          # Weight multiplier per sender rank level
  thread_activity: 0.5      # Weight for thread activity
  negative_prior: -2.0      # Penalty for noreply/unsubscribe patterns

context_budget:
  max_total_tokens: 7000    # Maximum total tokens for LLM input
  per_thread_max: 3         # Maximum chunks per thread

chunking:
  long_email_tokens: 1000   # Threshold for long email
  max_chunks_if_long: 3     # Max chunks for long emails
  max_chunks_default: 12    # Default max chunks per message
  adaptive_high_load_emails: 200  # Email count threshold for high load
  adaptive_high_load_threads: 60  # Thread count threshold for high load
  adaptive_multiplier: 0.75 # Multiplier for high load

shrink:
  enable_auto_shrink: true  # Enable auto-shrink on overflow
  preserve_min_quotas: true # Preserve minimum bucket quotas during shrink

hierarchical:
  enable: true              # Enable hierarchical mode
  auto_enable: true         # Auto-enable based on thresholds
  enable_auto: true         # Enable automatic hierarchical mode activation
  threshold_threads: 40     # Thread count threshold for auto activation (умеренный порог)
  threshold_emails: 200     # Email count threshold for auto activation
  min_threads_to_summarize: 6  # Minimum threads required to use hierarchical mode
  min_threads: 60           # Min threads to auto-activate (was 30)
  min_emails: 300           # Min emails to auto-activate (was 150)
  per_thread_max_chunks_in: 8  # Max chunks per thread for summarization
  per_thread_max_chunks_exception: 12  # Max chunks in exceptional cases (mentions, last update)
  summary_max_tokens: 90    # Max tokens for thread summary
  parallel_pool: 8          # Max parallel thread summarization workers
  timeout_sec: 20           # Timeout per thread summarization
  degrade_on_timeout: "best_2_chunks"  # Degradation strategy on timeout
  
  # Must-include chunks (guarantee critical info)
  must_include_mentions: true  # Always include chunks with user mentions
  must_include_last_update: true  # Always include last update chunk per thread
  
  # Merge policy (citation enrichment)
  merge_max_citations: 5    # Max citations in merged summary (3-5)
  merge_include_title: true # Include brief title in merged summary
  
  # Optimization
  skip_llm_if_no_evidence: true  # Skip LLM call if no evidence after selection
  
  final_input_token_cap: 4000  # Max tokens for final aggregator input
  max_latency_increase_pct: 50  # Max acceptable latency increase %
  target_latency_increase_pct: 30  # Target latency increase %
  max_cost_increase_per_email_pct: 40  # Max acceptable cost increase per email %

email_cleaner:
  enabled: true             # Enable email body cleaning
  keep_top_quote_head: true # Keep 1-2 paragraphs from top-level quote (inline replies)
  max_top_quote_paragraphs: 2  # Max paragraphs to keep from top quote
  max_top_quote_lines: 10   # Max lines to keep from top quote
  max_quote_removal_length: 10000  # Safety limit: max chars to remove in single block
  locales:                  # Supported locales for pattern matching
    - ru
    - en
  whitelist_patterns:       # Patterns to preserve even in quoted areas
    - '\b(deadline|срок|дедлайн|до)\s+\d{1,2}[./]\d{1,2}'  # Deadlines
    - '\b(approve|одобр|согласов)'  # Approval requests
  blacklist_patterns:       # Additional patterns to remove aggressively
    - 'Click here to unsubscribe'
    - 'Нажмите.*отписаться'
    - 'Privacy Policy'
    - 'Политика конфиденциальности'
  track_removed_spans: true # Track removed text spans for offset mapping

nlp:
  # Custom action verbs for domain-specific extraction
  # Format: verb_form: lemma
  custom_action_verbs:
    # EN domain-specific verbs
    deploy: deploy
    deployed: deploy
    deploying: deploy
    deploys: deploy
    merge: merge
    merged: merge
    merging: merge
    merges: merge
    # RU domain-specific verbs
    задеплоить: задеплоить
    задеплой: задеплоить
    задеплойте: задеплоить
    замержить: замержить
    замержь: замержить
    замержьте: замержить

ranker:
  enabled: false             # Set true to reorder items per section (DigestRanker)
  # Feature weights (will be normalized to sum to 1.0)
  weight_user_in_to: 0.15    # User is direct recipient (To)
  weight_user_in_cc: 0.05    # User is CC recipient
  weight_has_action: 0.20    # Item contains action markers
  weight_has_mention: 0.10   # Item mentions user
  weight_has_due_date: 0.15  # Item has deadline
  weight_sender_importance: 0.10  # Sender is important
  weight_thread_length: 0.05 # Long conversation thread
  weight_recency: 0.10       # Recent message
  weight_has_attachments: 0.05  # Has attachments
  weight_has_project_tag: 0.05  # Has project tag (JIRA, etc.)
  
  important_senders:         # Important sender emails or domain patterns
    - 'ceo@'
    - 'cto@'
    - 'manager@'
  
  log_positions: true        # Log item positions for A/B analysis

degrade:
  enable: true              # Enable degradation on LLM failures
  mode: "extractive"        # Degradation mode: extractive | empty

memory:
  # Cross-run dedup ledger (EP-7; default ON per decision D3). Repeat items get
  # seen_before:true and «↻ повтор» in MM — annotate only, never suppress. The
  # ledger stores SHA-256 fingerprints only, in .state/delivered-items.jsonl;
  # the TTL sweep IS the retention policy (delete the file = forget everything).
  # Aligned with retention.keep_days (one documented number); kept separate
  # because the ledger stores hashes only.
  dedup_ledger: true
  dedup_ttl_days: 7

reranker:
  # P2-gate support scoring on the fleet reranker (EP-12, D4/PC-2 approved).
  # Stays OFF until corp validation (EP-14); flag-off runs make zero fleet calls.
  enabled: false
  tau: 0.0                   # support-score threshold for weak_evidence
  budget_per_run: 10         # the reranker is the scarce, non-batchable resource
  low_confidence_threshold: 0.7  # only items below this confidence spend the budget
  quarantine_weak: true      # D1: weak items go to «Не подтверждено», never dropped

judge:
  # Cross-model repair judge (EP-12, D1 rescue path). Must differ from llm.model
  # (R4) — a same-model config disables the judge with a warning. OFF until EP-14.
  enabled: false
  model: "qwen35-35b-a3b"    # own RPM bucket; stage budget judge=8

eval:
  # Judge architecture for eval runs (D5, hybrid by job). 'pointwise' = advisory
  # dashboard only; 'reference' = reference-anchored judging vs gold rows
  # (eval-judge-run). Nothing gates CI until κ >= 0.41 + CI floor (EP-15).
  judge_mode: "pointwise"

extract:
  # Best-of-N extraction selected by the citation gate (EP-10). 1 = today's
  # single-shot path. Raising N requires raising llm.stage_call_budgets.extractor
  # alongside (ADR-008 v2) — with the default budget of 2, sampling degrades
  # back to N=1. Live N/temperature tuning happens in corp (EP-14).
  best_of_n: 1
  sample_temperature: 0.7    # candidates 2..N; candidate 1 stays deterministic
