[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digest-core"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic-settings>=2.4",
  "pydantic>=2.7",
  "structlog>=24.1",
  "httpx>=0.27",
  "exchangelib>=5.3.6",
  "tenacity>=9.0",
  "prometheus-client>=0.20",
  "beautifulsoup4>=4.12",
  "pytz>=2023.3",
  "pyyaml>=6.0",
  "regex>=2023.0",
  "jinja2>=3.1",
  "rich>=13.7",
]

[project.scripts]
digest-core = "digest_core.cli:app"
actionpulse = "digest_core.cli:app"
actionpulse-mcp = "digest_core.mcp:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]
# Opt-in encrypted message store (digest_core.store). Install-time opt-in,
# matching the runtime default-OFF: a default `uv sync` does NOT pull these.
# Enable with `uv sync --extra store`.
#   * Linux: sqlcipher3-binary ships a prebuilt SQLCipher (manylinux wheel).
#   * macOS: sqlcipher3 builds from source (bundled SQLCipher amalgamation);
#     needs openssl available — `brew install openssl@3` and, if the build can't
#     find it, export CPPFLAGS/LDFLAGS pointing at the brew prefix.
# Both distributions expose `import sqlcipher3`.
store = [
    "numpy>=1.26",
    "sqlcipher3-binary>=0.6.0; platform_system == 'Linux'",
    "sqlcipher3>=0.5.4; platform_system == 'Darwin'",
]
# Opt-in MCP server (digest_core.mcp) exposing the local InboxAPI over stdio to AI
# coding CLIs. A default `uv sync` does NOT pull it; enable with `uv sync --extra mcp`
# (also needs `--extra store` to actually read the message store).
mcp = [
    "mcp>=1.2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "black>=24.0",
  "hypothesis>=6.155.2",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/digest_core"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that are intentionally slower than the rest of the suite",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
